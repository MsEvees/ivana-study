<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ivana — Welcome</title><link rel="stylesheet" href="css/styles.css"></head>
<body class="login-page">
<div class="login">
  <section class="art login-art">
    <div class="daisy-scene">
      <img src="assets/images/ivana-daisy.png" alt="Hand-painted white daisy">
      <div class="login-wordmark">Ivana</div>
      <p class="login-tagline">Take your time. There is always another connection waiting to be found.</p>
    </div>
  </section>
  <section class="loginbox">
    <div class="box">
      <div class="eyebrow">Your study space</div>
      <h2>Welcome back.</h2>
      <p>Your books, notes, questions, and growing knowledge map belong here.</p>
      <form id="loginForm">
        <label>Email</label>
        <input id="loginEmail" class="input" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input id="loginPassword" class="input" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button class="btn primary" id="loginButton" type="submit">Sign in</button>
        <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
        <div class="auth-links"><button type="button" class="text-link" id="createAccountLink">Create an account</button><button type="button" class="text-link" id="forgotPasswordLink">Forgot your password?</button></div>
      </form>
    </div>
  </section>
</div>
<div class="auth-modal" id="authModal" hidden>
  <div class="auth-modal-card">
    <button class="modal-close" id="authModalClose" type="button" aria-label="Close">×</button>
    <div class="eyebrow" id="authModalEyebrow">Create an account</div>
    <h2 id="authModalTitle">Begin your study space.</h2>
    <p id="authModalIntro">Create your account and we’ll keep your study space connected to you.</p>
    <form id="signupForm">
      <label>Email</label>
      <input id="signupEmail" class="input" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label>Password</label>
      <input id="signupPassword" class="input" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required>
      <label>Confirm password</label>
      <input id="signupConfirm" class="input" type="password" autocomplete="new-password" placeholder="Enter your password again" minlength="6" required>
      <button class="btn primary" id="signupButton" type="submit">Create account</button>
      <p id="signupStatus" class="login-status" role="status" aria-live="polite"></p>
    </form>
    <form id="resetForm" hidden>
      <label>Email</label>
      <input id="resetEmail" class="input" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button class="btn primary" id="resetButton" type="submit">Send reset link</button>
      <p id="resetStatus" class="login-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/app.js"></script></body></html>
