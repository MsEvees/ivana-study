<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ivana — Welcome</title><link rel="stylesheet" href="css/styles.css"></head>
<body class="login-page">
<div class="login">
  <section class="art login-art">
    <div class="daisy-scene">
      <img src="assets/images/ivana-daisy.png" alt="Hand-painted white daisy">
      <div class="login-wordmark">Ivana</div>
      <p class="login-tagline">Read. Understand. Connect. Explore.</p>
      <p class="login-small">A quiet study space for turning reading into mastery.</p>
    </div>
  </section>
  <section class="loginbox">
    <div class="box">
      <div class="eyebrow">Your study space</div>
      <h2>Welcome back.</h2>
      <p>Your books, notes, questions, and growing knowledge map belong here.</p>
      <form id="loginForm">
        <label>Email</label>
        <input id="loginEmail" class="input" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input id="loginPassword" class="input" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button class="btn primary" id="loginButton" type="submit">Sign in</button><p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/app.js"></script></body></html>
